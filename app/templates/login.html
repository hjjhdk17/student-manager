<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student Manager — Login">
    <title>Login — Student Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        (function() {
            var theme = localStorage.getItem('theme') || 'system';
            if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <style>
        /* Login-specific styles — scoped to this page only */
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-primary);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo {
            width: 56px;
            height: 56px;
            background: var(--accent);
            border-radius: var(--radius-lg);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #fff;
            margin-bottom: 16px;
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .login-subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 28px;
        }

        .login-form .form-group {
            margin-bottom: 18px;
        }

        .login-form .form-input {
            width: 100%;
            padding: 11px 14px;
        }

        .login-form .btn {
            width: 100%;
            padding: 11px 18px;
            font-size: 0.9rem;
            margin-top: 6px;
        }

        .login-error {
            background: var(--danger-bg);
            border: 1px solid rgba(248, 113, 113, 0.25);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            margin-bottom: 18px;
            font-size: 0.84rem;
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .login-error-icon {
            font-size: 1rem;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-header">
                <div class="login-logo" aria-hidden="true">🎓</div>
                <h1 class="login-title">Student Manager</h1>
                <p class="login-subtitle">Sign in to your account</p>
            </div>

            <div class="login-card">
                {% if error %}
                <div class="login-error" role="alert">
                    <span class="login-error-icon" aria-hidden="true">✕</span>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                <form class="login-form" method="POST" action="{{ url_for('auth.login_post') }}" id="login-form">
                    <div class="form-group">
                        <label class="form-label" for="login-username">Username or Email</label>
                        <input type="text" class="form-input" id="login-username"
                               name="username" placeholder="Enter username or email"
                               autocomplete="username" required autofocus>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="login-password">Password</label>
                        <input type="password" class="form-input" id="login-password"
                               name="password" placeholder="Enter password"
                               autocomplete="current-password" required>
                    </div>

                    <button type="submit" class="btn btn-primary" id="login-submit">
                        Sign In
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
